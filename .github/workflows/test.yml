name: Check formatting, linting, and run tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches:
      - main

jobs:
  format-lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: |
          echo "Running Prettier to check for formatting issues..."
          npm run prettier:check

      - name: Run ESLint check
        run: |
          echo "Running ESLint to check for linting issues..."
          npm run lint

      - name: Run TypeScript compile check
        run: |
          echo "Running TypeScript compiler to check for type issues..."
          npx tsc --noEmit

      - name: Run Playwright API tests
        env:
          DL_USERNAME: ${{ secrets.DL_USERNAME }}
          DL_PASSWORD: ${{ secrets.DL_PASSWORD }}
          PRODUCTS_API_KEY: ${{ secrets.PRODUCTS_API_KEY }}
          TEST_ORDERS_API_KEY: ${{ secrets.TEST_ORDERS_API_KEY }}
          X_APPLICATION_NAME: ${{ secrets.X_APPLICATION_NAME }}
          X_SESSION_ID: ${{ secrets.X_SESSION_ID }}

        run: |
          echo "Running Playwright to execute API tests..."
          npx playwright test
